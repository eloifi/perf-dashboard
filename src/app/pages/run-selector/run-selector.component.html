<div class="flex gap-4 p-4">
  <!-- Sélecteur Run A -->
  <select class="border p-2 rounded" [(ngModel)]="selectedRunA" (change)="emitSelection()">
    <option *ngFor="let r of runs" [value]="r.id">
      Run A : {{ r.timestamp | date: 'short' }} (score {{ r.globalScore }})
    </option>
  </select>

  <!-- Sélecteur Run B -->
  <select class="border p-2 rounded" [(ngModel)]="selectedRunB" (change)="emitSelection()">
    <option *ngFor="let r of runs" [value]="r.id">
      Run B : {{ r.timestamp | date: 'short' }} (score {{ r.globalScore }})
    </option>
  </select>
</div>
