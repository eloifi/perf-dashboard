<div class="min-h-screen flex flex-col gap-4 p-4 bg-gray-50">

    <!-- Barre de contrôle -->
    <div class="flex flex-wrap items-center gap-4">
        <app-selector (selection)="onAppScenario($event)"></app-selector>

        <run-selector [app]="app" [scenario]="scenario" (selection)="onRunSelection($event)">
        </run-selector>

        <button class="px-3 py-1 border rounded text-xs" (click)="dense = !dense">
            Mode dense
        </button>

        <button class="px-3 py-1 border rounded text-xs">
            Export CSV
        </button>
    </div>

    <!-- Zone principale -->
    <div [class.compact]="dense" class="grid grid-cols-3 gap-4 flex-1">

        <!-- Colonne 1 : Run A + Run B -->
        <div class="col-span-1 flex flex-col gap-4">
            <diff-runs-page [app]="app" [scenario]="scenario" [runAId]="runAId" [runBId]="runBId" section="summary">
            </diff-runs-page>
        </div>

        <!-- Colonne 2 : Résumé + Status + Score -->
        <div class="col-span-1 flex flex-col gap-4">
            <diff-runs-page [app]="app" [scenario]="scenario" [runAId]="runAId" [runBId]="runBId" section="metrics">
            </diff-runs-page>

            <diff-runs-page [app]="app" [scenario]="scenario" [runAId]="runAId" [runBId]="runBId" section="status">
            </diff-runs-page>

            <diff-runs-page [app]="app" [scenario]="scenario" [runAId]="runAId" [runBId]="runBId" section="score">
            </diff-runs-page>
        </div>

        <!-- Colonne 3 : métriques avancées -->
        <div class="col-span-1 flex flex-col gap-4">
            <diff-runs-page [app]="app" [scenario]="scenario" [runAId]="runAId" [runBId]="runBId" section="advanced">
            </diff-runs-page>
        </div>

    </div>
</div>
