<div class="p-4 space-y-4">

    <h1 class="text-xl font-semibold mb-4">Perf Dashboard</h1>

    <!-- Run selector -->
    <run-selector *ngIf="runs && runs.length > 0" [runs]="runs" [runAId]="runAId" [runBId]="runBId"
        (selection)="onSelectionChange($event)">
    </run-selector>

    <div *ngIf="!runs || runs.length === 0" class="text-sm text-gray-500">
        Aucun run disponible pour {{ app }} / {{ scenario }}.
    </div>

    <!-- Sections -->
    <section *ngIf="runAId && runBId" class="space-y-6 mt-6">

        <diff-runs-page [runAId]="runAId" [runBId]="runBId" section="summary">
        </diff-runs-page>

        <diff-runs-page [runAId]="runAId" [runBId]="runBId" section="metrics">
        </diff-runs-page>

        <diff-runs-page [runAId]="runAId" [runBId]="runBId" section="status">
        </diff-runs-page>

        <diff-runs-page [runAId]="runAId" [runBId]="runBId" section="score">
        </diff-runs-page>

        <diff-runs-page [runAId]="runAId" [runBId]="runBId" section="advanced">
        </diff-runs-page>

    </section>

    <div *ngIf="!(runAId && runBId)" class="text-sm text-gray-500">
        Sélectionner Run A et Run B pour afficher les comparaisons.
    </div>

</div>
