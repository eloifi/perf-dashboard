<div [class.dashboard]="true" [class.dark]="dark" [class.compact]="dense">

    <div class="flex items-center gap-4 mb-4">
        <button class="px-3 py-1 border rounded" (click)="dense = !dense">
            Mode compact : {{ dense ? 'ON' : 'OFF' }}
        </button>

        <button class="px-3 py-1 border rounded" (click)="dark = !dark">
            Mode dark : {{ dark ? 'ON' : 'OFF' }}
        </button>

        <button class="px-3 py-1 border rounded" (click)="section = 'summary'">Summary</button>
        <button class="px-3 py-1 border rounded" (click)="section = 'metrics'">Metrics</button>
        <button class="px-3 py-1 border rounded" (click)="section = 'score'">Score</button>
        <button class="px-3 py-1 border rounded" (click)="section = 'trend'">Trend</button>
    </div>

    <!-- sélecteurs Run A / Run B (tu gardes les tiens) -->

    <diff-runs-page [runAId]="runAId" [runBId]="runBId" [baseline]="baselineRun" [baselines]="baselines" [trend]="trend"
        [section]="section">
    </diff-runs-page>
</div>
