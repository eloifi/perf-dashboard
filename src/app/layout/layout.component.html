<div [class.dark-theme]="dark">
    <mat-sidenav-container class="layout-container">

        <!-- SIDENAV -->
        <mat-sidenav mode="side" opened class="sidenav">
            <mat-toolbar color="primary">Perf Dashboard</mat-toolbar>

            <mat-nav-list>
                <a mat-list-item routerLink="/applications" routerLinkActive="active">Applications</a>
                <a mat-list-item routerLink="/runs" routerLinkActive="active">Runs</a>
                <a mat-list-item routerLink="/graphs" routerLinkActive="active">Graphs</a>
            </mat-nav-list>
        </mat-sidenav>

        <!-- CONTENT -->
        <mat-sidenav-content>
            <mat-toolbar color="primary" class="topbar">
                <span class="title">Dashboard</span>
                <span class="spacer"></span>

                <button mat-icon-button (click)="toggleDark()">
                    <mat-icon>{{ dark ? 'light_mode' : 'dark_mode' }}</mat-icon>
                </button>

                <mat-form-field appearance="fill" style="width: 200px; margin-left: 16px;">
                    <mat-label>Environnement</mat-label>
                    <mat-select [value]="env.current" (selectionChange)="changeEnv($event.value)">
                        <mat-option *ngFor="let e of envs" [value]="e">
                            {{ e | uppercase }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <span class="env-display">Env: {{ env.current | uppercase }}</span>
            </mat-toolbar>

            <div class="content">
                <router-outlet></router-outlet>
            </div>
        </mat-sidenav-content>

    </mat-sidenav-container>
</div>
