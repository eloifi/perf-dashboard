<mat-toolbar color="primary">
    <span>Perf Dashboard</span>

    <span class="spacer"></span>

    <mat-form-field appearance="outline">
        <mat-label>Application</mat-label>
        <mat-select [value]="selectedApp" (selectionChange)="onSelect($event.value)">
            <mat-option *ngFor="let app of apps" [value]="app.name">
                {{ app.name }}
            </mat-option>
        </mat-select>
    </mat-form-field>
</mat-toolbar>
